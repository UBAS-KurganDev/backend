[project]
name = "ubas-backend"
version = "0.1.0"
description = "UBAS backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "tzdata>=2026.4",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]
