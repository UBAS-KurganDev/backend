[project]
name = "ubas-backend"
version = "0.1.0"
description = "UBAS backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.12,<3",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ubas-api = "ubas_backend.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["src"]
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.9",
]
