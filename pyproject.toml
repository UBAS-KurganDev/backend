[project]
name = "ubas-backend"
version = "0.1.0"
description = "UBAS backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21",
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pydantic>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.45",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
ubas-api = "ubas_backend.main:main"
ubas-import-cities = "ubas_backend.import_cities:main"
ubas-migrate = "ubas_backend.migrate:main"
ubas-worker = "ubas_backend.worker:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["asyncpg"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
